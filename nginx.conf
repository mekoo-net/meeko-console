# 只替换 conf.d 里的 server。主配置仍由官方镜像提供，并以 daemon off 前台运行。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 文件名带内容哈希，可以长期缓存。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口不能长缓存，否则浏览器会一直用旧的资源哈希。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # createWebHistory：刷新 /accounts 这类路径时磁盘上没有对应文件，回到入口。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
