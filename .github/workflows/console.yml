name: Console

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*'] # 打 semver tag（如 v0.1.0）时追加构建并推送镜像
  workflow_dispatch:

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # PR / push / tag 都先跑：类型检查 + lint + 测试 + 编译验证（产物丢弃）
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
          cache: true

      - name: Install
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - run: bun run type-check
      - run: bun run lint
        continue-on-error: true
      - run: bun run test

      - name: Production build
        env:
          NODE_ENV: production
          VITE_USE_MOCK: 'false'
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://api.platform.meeyo.org' }}
        run: bun run build

  # 仅在打 tag 或手动触发时执行：构建并推送 ghcr.io/<repo>/meeko-console
  # VITE_API_BASE → Meeko 平台 Gateway（/api、/auth、/demux 等产品控制面）
  docker:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: meeko-console
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          BASE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$BASE" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"
            echo "tags=$BASE:latest,$BASE:$V,$BASE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$BASE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_USE_MOCK=false
            VITE_API_BASE=${{ vars.VITE_API_BASE || 'https://api.platform.meeyo.org' }}

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
